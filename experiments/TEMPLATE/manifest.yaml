# Experiment manifest — normally GENERATED by shared/experiment_logging.save_experiment_run into
# experiments/experiment_<YYYY_MM_DD_HH_MM>[_<slug>]/. This template documents every field for
# reference and for runs driven from a plain script. It must be sufficient to reproduce metrics.csv.

id: experiment_YYYY_MM_DD_HH_MM_slug   # = the folder name, e.g. experiment_2026_06_13_09_06_seasonal_heat_cold
title: One-line description of the question being asked
hypothesis: >
  State the testable claim. e.g. "Filtering analogs by seasonal_heat_cold lowers median
  MAPE_24 on H2 holidays vs the shape_pearson_CDE_map_FGH default, without raising fail rate."
baseline_experiment_id: null      # id of the experiment this is compared against (null if first)

provenance:
  date: YYYY-MM-DD
  author: ""
  git_commit: ""                  # output of: git rev-parse HEAD
  git_branch: ""
  source_file: holidays/holiday_demand_mx.csv
  selector_features: holidays/holiday_selector_features.csv
  selector_priors: holidays/holiday_selector_priors.csv
  random_seed: 42
  environment:
    python: ""                    # e.g. 3.11.x
    key_packages: ""              # pandas / numpy / scikit-learn / optuna versions

scope:
  unique_ids:                     # SEN regions tested (subset or all 8)
    - SEN_demand_SIN
  target_dates_var: TARGET_DATES_2025
  target_dates: []                # optional explicit (date_str, label) list if not using the var
  holiday_day_types: [H1, H2, H3, H4]

components:
  window:
    season_length: 38
    forecast_start_offset_hours: 14   # keep season_length = offset + 24
    special_labels: ["holiday"]
  cluster:
    use_cluster: true
    match_target_cluster: true
    cluster_column: analog_cluster
    analog_cluster_criterion: shape_pearson_CDE_map_FGH   # see ANALOG_CLUSTER_CRITERIA_CATALOG
  analog_selection:
    typedist: pearson             # fixed value, or "optuna" if tuned (record winners in metrics.csv)
    k: 100
    min_special_points: 24
    min_event_gap: 24
    max_events: null
    recent_weekend_analogs: 0
  regression:
    typereg: PCR                  # fixed value, or "optuna"
    scale_method: null
    n_components: 2
    regressor_params: {}
    levels: [50, 80, 95]
  tuning:
    optuna_enabled: true
    optuna_min_k: 2
    n_trials: 25
    timeout_sec: 900
    typedist_choices: [pearson, euclidian]
    typereg_choices: [PCR, PLS, RidgeReg, LassoReg]
    scale_method_choices: [null, standard, minmax]
  training_cutoff: rolling        # only dates strictly earlier than each target are used

outputs:
  metrics_csv: metrics.csv
  summary_csv: summary.csv
  plots_dir: plots/
  primary_metric: mape_24_pct     # the number the hypothesis is judged on
